name: CI

on:
  push:
  pull_request:

env:
  # 測試假設台灣時區(健保雲端為台灣服務;chineseMedProcessor 的午夜界線計算依本地時區)
  TZ: Asia/Taipei

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm test
      - run: npm run build
